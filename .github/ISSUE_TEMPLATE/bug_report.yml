name: Bug report
description: Report a reproducible Snapshot bug.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction.
      placeholder: |
        1. Start Snapshot with ...
        2. Upload ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run `docker compose logs --no-color` and paste relevant lines.
      render: text
  - type: input
    id: version
    attributes:
      label: Snapshot version or image tag
      placeholder: ghcr.io/walkaisa/snapshot:1.0.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Docker version, reverse proxy, deployment method
