name: Docker image

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version to stamp and tag. Empty publishes an edge build.'
        type: string
        required: false
        default: ''
      ref:
        description: 'Commit to build. Empty builds the commit that triggered the caller.'
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (e.g. 1.2.0). Leave empty for an edge build.'
        type: string
        required: false
        default: ''
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'compose.yml'
      - '.dockerignore'
      - '.github/workflows/docker.yml'

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/walkaisa/snapshot

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ inputs.version }}
          labels: |
            org.opencontainers.image.title=Snapshot
            org.opencontainers.image.description=Secure self-hosted upload API for screenshots and media files
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ inputs.ref || github.sha }}
            org.opencontainers.image.version=${{ inputs.version || github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
          outputs: ${{ github.event_name != 'pull_request' && 'type=image,name=ghcr.io/walkaisa/snapshot,push-by-digest=true,name-canonical=true,push=true' || 'type=cacheonly' }}

      - name: Export the digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish the multi-arch tag
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the tag inputs
        id: vars
        env:
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.ref || github.sha }}
        run: |
          echo "short=${REVISION:0:7}" >> "$GITHUB_OUTPUT"
          if [ -n "$VERSION" ]; then
            echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable=${{ inputs.version == '' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=${{ steps.vars.outputs.minor }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=raw,value=sha-${{ steps.vars.outputs.short }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect the published tag
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

  compose:
    name: Validate production compose
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate compose.yml
        run: docker compose config --quiet
        env:
          BASE_URL: https://example.com
          SESSION_SECRET: ci-validation-secret-that-is-long-enough
          MFA_ENCRYPTION_KEY: ci-mfa-encryption-key-that-is-long-enough
          POSTGRES_PASSWORD: ci-validation-password
